openapi: 3.1.0
info:
  title: Auto Rebalance Service
  version: 2.0.0_rc.1
  description: API to update Auto Rebalance (AR) transactions.

paths:
  /v2/policies/{policyNumber}/arrangements/auto-rebalance/{arrangementId}:
    put:
      operationId: updateAR
      description: >
        Update an existing Auto Rebalance (AR) arrangement for the identified policy.
      tags:
        - Auto Rebalance
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AssociatedFirmId'
        - $ref: '#/components/parameters/ArrangementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutoRebalanceRequest'
            examples:
              AR_Update_Example_Full:
                value:
                  effectiveDate: 2026-06-15
                  nsccParticipantId: "NSCC998877"
                  cusip: "123AB4567"
                  actionIndicator: "O"
                  arrangement:
                    productCode: "AR-001"
                    arrangementType: "ASSET_REBALANCING"
                    arrangementSubType: "STANDARD_REBALANCE"
                    startDate: 2026-06-15
                    endDate: 2030-06-15
                    destinationTransferAmountType: "PERCENT"
                    frequency: "MONTHLY"
                    nextTransactionDate: 2026-07-15
                  funds:
                    transferToFunds:
                      - fundId: "DST-FUND-101"
                        requestedPercentage: 100
                  auditTransSummation:
                    auditTotalType: "SUM"
                    auditTotal: 1000.00
                    correlationGuid: "123e4567-e89b-12d3-a456-426614174000"
                    correlationIdState: "INITIAL_USAGE"
                  parties:
                    - type: "INDIVIDUAL"
                      firstName: "John"
                      middleName: "A"
                      lastName: "Doe"
                      taxId: "123456789"
                      relationships:
                        - OWNER
                  producer:
                    producerNumber: "456789"
                    npn: "123456"
                    crdNumber: "654321"
              AR_Cancel_Example:
                summary: Cancel an existing Auto Rebalance arrangement
                value:
                  effectiveDate: "2026-08-01"
                  nsccParticipantId: "NSCC998877"
                  cusip: "123AB4567"
                  actionIndicator: "C"
                  arrangement:
                    productCode: "AR-001"
                    arrangementType: "ASSET_REBALANCING"
                    arrangementSubType: "STANDARD_REBALANCE"
                    startDate: "2026-06-15"
                    endDate: "2030-06-15"
                    destinationTransferAmountType: "PERCENT"
                    frequency: "MONTHLY"
                    nextTransactionDate: "2026-09-15"
                  funds:
                    transferToFunds:
                      - fundId: "DST-FUND-101"
                        requestedPercentage: 100
                  auditTransSummation:
                    auditTotalType: "SUM"
                    auditTotal: 1000.00
                    correlationGuid: "123e4567-e89b-12d3-a456-426614174000"
                    correlationIdState: "INITIAL_USAGE"
                  parties:
                    - type: INDIVIDUAL
                      firstName: "John"
                      middleName: "A"
                      lastName: "Doe"
                      taxId: "123456789"
                      relationships:
                        - OWNER
                  producer:
                    producerNumber: "456789"
                    npn: "123456"
                    crdNumber: "654321"

      responses:
        '202':
          description: |
            Accepted — request accepted for processing.
          headers:
            Location:
              description: >
                URL of the arrangement-request resource created to track this update; poll it with getArrangementRequest for the processing outcome
                Format: /v2/policies/{policyNumber}/arrangement-requests/{requestId}
              schema:
                type: string
                format: uri
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRebalanceResponse'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '405': { $ref: '#/components/responses/MethodNotAllowedError' }
        '406': { $ref: '#/components/responses/NotAcceptableError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaTypeError' }
        '422': { $ref: '#/components/responses/UnprocessableEntityError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGatewayError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
        '504': { $ref: '#/components/responses/GatewayTimeoutError' }

  /v2/policies/{policyNumber}/arrangement-requests/{requestId}:
    get:
      operationId: getArrangementRequest
      tags:
        - Arrangement Request Lifecycle
      description: >
        Retrieve the current processing status of a previously submitted arrangement request. This endpoint allows clients to poll for status updates until the transaction reaches a final outcome.
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - name: requestId
          in: path
          required: true
          description: >
            Server-assigned identifier for the arrangement request. Used to correlate the Day-1 request with the Day-2 confirmation.
          schema:
            type: string
      responses:
        '200':
          description: Arrangement request resource.
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArrangementRequestStatus'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  headers:
    correlationId:
      description: Correlates this response to requests and downstream logs.
      required: true
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequestError:
      description: Bad Request
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Unauthorized
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Forbidden
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Not Found
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowedError:
      description: Method Not Allowed
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptableError:
      description: Not Acceptable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Conflict
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Payload Too Large
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaTypeError:
      description: Unsupported Media Type
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: Unprocessable Entity
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: Too Many Requests
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGatewayError:
      description: Bad Gateway
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableError:
      description: Service Unavailable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeoutError:
      description: Gateway Timeout
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      description: Unique policy number.
      schema:
        type: string
        minLength: 1
        maxLength: 30
    CorrelationId:
      name: correlationId
      in: header
      required: true
      description: Unique identifier to trace the request.
      schema:
        type: string
        maxLength: 100
    AssociatedFirmId:
      name: associatedFirmId
      in: query
      required: true
      description: >
        Query parameter for the associated firm ID (implementation-defined value) used to further identify a firm that is doing business on behalf of multiple distribution firms.
      schema:
        type: string
        minLength: 1
        maxLength: 65
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      description: >
        Identifier (defined by the source system) used enables the system to determine whether an arrangement already exists and supports subsequent updates, modifications, or termination of that arrangement.
      schema:  
          type: string
          minLength: 1
          maxLength: 100

  schemas:
    UpdateAutoRebalanceRequest:
      type: object
      description: >
        Represents a request to update or cancel an existing Auto Rebalance arrangement on a policy.
      required:
        - effectiveDate
        - actionIndicator
        - arrangement
        - nsccParticipantId
        - producer
      properties:
        effectiveDate:
          type: string
          description: >
            When the transaction was originally scheduled or expected to happen, can be a non-business day.
          format: date
        nsccParticipantId:
          type: string
          description: >
            Unique identifier assigned to the submitting firm or participant within the NSCC network for transaction routing and processing.
          maxLength: 100
        cusip:
          type: string
          description: >
            Unique identification code. Optional; REQUIRED only when policyNumber is not globally unique.
          minLength: 9
          maxLength: 9
          pattern: '^[A-Z0-9]{1,9}$'
        actionIndicator:
          type: string
          enum: [O, C]
          description: >
              Action to perform on the arrangement.
              O = Update or override an existing arrangement.
              C = Cancel an existing arrangement.
        arrangement:
          description: >
            Defines the transaction configuration, including schedule frequency and how transfers are executed over time.
          allOf:
            - $ref: '#/components/schemas/Arrangement'
        funds:
          description: >
            Defines the target fund allocation for the Auto Rebalance arrangement.
          allOf:
            - $ref: '#/components/schemas/Funds'
        auditTransSummation:
          description: >
            Summary information used to audit one or more transactions.
          allOf:
            - $ref: '#/components/schemas/AuditTransSummation'
        parties:
          type: array
          description: >
            Schema for parties data.
          items:
            $ref: '#/components/schemas/Party'
        producer:
          description: >
            Information about the producer submitting the request.
          allOf:
            - $ref: '#/components/schemas/Producer'
      allOf:
        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    const: STANDARD_REBALANCE
          then:
            required:
              - funds
        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    enum:
                      - REBALANCE_TO_VARIABLE_FUNDS_ONLY
                      - REBALANCE_TO_STANDING_ALLOCATIONS
          then:
            not:
              required:
                - funds

    Arrangement:
      type: object
      description: >
        Defines the transaction configuration, including schedule frequency and how transfers are executed over time.
      required:
        - productCode
        - arrangementType
        - frequency
        - destinationTransferAmountType
        - arrangementSubType
      properties:
        productCode:
          type: string
          description: >
            Product code identifying the underlying product for this arrangement.
          maxLength: 100
        arrangementType:
          type: string
          description: >
            Specifies the arrangement type. Only ASSET_REBALANCING is supported.
          const: ASSET_REBALANCING
        arrangementSubType:
          type: string
          description: >
            Specifies the subtype of the Auto Rebalance arrangement.
          enum: [STANDARD_REBALANCE, REBALANCE_TO_VARIABLE_FUNDS_ONLY, REBALANCE_TO_STANDING_ALLOCATIONS]
        startDate:
          type: string
          description: >
            The date the arrangement should start.
          format: date
        endDate:
          type: string
          description: >
            The date the arrangement should end.
          format: date
        destinationTransferAmountType:
          type: string
          description: >
            Indicates how transfer amount is defined for the arrangement destination.
          const: PERCENT
        frequency:
          type: string
          description: >
            Indicates how often the Auto Rebalance executes.
          enum: [DAILY, EVERY_TWO_WEEKS, MONTHLY, SEMI_ANNUAL, QUARTERLY, ANNUAL]
        nextTransactionDate:
          type: string
          description: >
            Indicates the next scheduled execution date of the AR transaction.
          format: date

    Funds:
      type: object
      description: >
        Defines the target fund allocation for the Auto Rebalance arrangement.
        Fund allocations are used only when arrangement.arrangementSubType is STANDARD_REBALANCE.
        For REBALANCE_TO_VARIABLE_FUNDS_ONLY and REBALANCE_TO_STANDING_ALLOCATIONS, the allocation is derived from existing policy allocations and the funds object must not be supplied.
        Because Auto Rebalance uses a destinationTransferAmountType of PERCENT, each target fund must specify a requestedPercentage.
      properties:
        transferToFunds:
          type: array
          description: >
            List of funds to which value is moved.
          minItems: 1
          items:
            $ref: '#/components/schemas/FundItem'

    FundItem:
      type: object
      description: >
          Represents a single destination fund participating in the arrangement.
      required:
        - fundId
        - requestedPercentage
      properties:
        fundId:
          type: string
          description: >
            Unique identifier of the fund associated with the transaction.
          maxLength: 100
        requestedPercentage:
          type: number
          description: >
            Specified percentage associated with the fund allocation.
          minimum: 0
          maximum: 100

    AuditTransSummation:
      type: object
      description: >
        Summary information used to audit one or more transactions.
      properties:
        auditTotalType:
          type: string
          description: >
            Method which multiple data may be summarized into a total.
          enum: [COUNT, SUM, MEAN]
        auditTotal:
          type: number
          description: >
            The numeric value for the total.
          minimum: 0
          format: double
        correlationGuid:
          type: string
          description: >
            GUID used for reconciliation of this transaction within the submitting firm's audit pipeline. Distinct from the transport-level correlationId header.
          format: uuid
        correlationIdState:
          type: string
          description: >
            Indicates if the correlation GUID is the initial response, ongoing response or last series of responses.
          enum: [INITIAL_USAGE, ONGOING_USAGE, FINAL_USAGE]

    Producer:
      type: object
      description: >
        Identifies the advisor or producer associated with the transaction.
        Producer information is used for audit, regulatory, and reporting purposes.
      required:
        - npn
      properties:
        producerNumber:
          type: string
          description: >
            Carrier-assigned unique identifier for the producer.
          maxLength: 100
        npn:
          type: string
          description: >
            The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
          maxLength: 100
        crdNumber:
          type: string
          description: >
            The Central Registration Depository (CRD) number assigned by FINRA to identify the financial professional.
          maxLength: 100

    Party:
      type: object
      description: |
        The parties object represents the policy parties relevant to the arrangement (owners, annuitants, beneficiaries, etc.), along with their identity, relationship.
      anyOf:
        - $ref: '#/components/schemas/IndividualParty'
        - $ref: '#/components/schemas/EntityParty'

    IndividualParty:
      description: Schema for individual party data.
      type: object
      allOf:
        - $ref: '#/components/schemas/IndividualIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    EntityParty:
      description: Schema for entity party data.
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    IndividualIdentity:
      description: Schema for individual identity data.
      required: [firstName, lastName, taxId, type]
      type: object
      properties:
        type:
          type: string
          description: >
            Indicates whether the party is an individual or an entity.
          const: INDIVIDUAL
        firstName:
          type: string
          description: >
            First name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        middleName:
          type: string
          description: >
            The middle name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        lastName:
          type: string
          description: >
            The last name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        taxId:
          type: string
          description: >
            Party's tax identification number.
          maxLength: 9

    EntityIdentity:
      description: Schema for entity identity data.
      type: object
      required: [type, name, taxId]
      properties:
        type:
          type: string
          description: >
            Indicates whether the party is an individual or an entity.
          const: ENTITY
        name:
          type: string
          description: >
            Entity name of the party.
          minLength: 1
          maxLength: 180
          pattern: '^[\w=()*@#\s.,''\/~%$!;:&"®`\\?\-]{1,180}$'
        taxId:
          type: string
          description: >
            Party's tax identification number.
          maxLength: 9

    PartyRelationship:
      description: Schema for party relationship data.
      type: object
      required: [relationships]
      properties:
        relationships:
          type: array
          description: >
            Relationship(s) this party has to the policy.
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [OWNER, JOINT_OWNER, ANNUITANT, JOINT_ANNUITANT, PRIMARY_BENEFICIARY, CONTINGENT_BENEFICIARY]

    AutoRebalanceResponse:
      description: Synchronous Day-1 response to an Auto Rebalance update request.
      type: object
      required:
        - status
        - requestId
      properties:
        requestId:
          description: >
           Server-assigned identifier for the arrangement request. Used to correlate the Day-1 request with the Day-2 confirmation.
          type: string
        status:
          description: Synchronous-tier outcome.
          type: string
          const: ACCEPTED
        message:
          description: Optional informational message related to request submission.
          type: string
        effectiveDate:
          type: string
          description: >
              When the transaction was originally scheduled or expected to happen, can be a non-business day.
          format: date

    Day2ArrangementConfirmationEvent:
      x-event-mesh:
        broker: Advanced Event Mesh
        topicPattern: "{root}/ift/v1/{eventType}/{status}/{transactionType}/{firm}"
        deliveryModel: topic-subscription
        note: >
          Delivered over a message broker via topic subscription, not an HTTP callback.
      type: object
      description: >
        Canonical Day-2 arrangement confirmation event published to the enterprise event mesh after an arrangement transaction completes processing.
      required:
        - eventType
        - eventId
        - eventTimestamp
        - associatedFirmId
        - requestId
        - policyNumber
        - transactionType
        - status
        - transExeDate
        - transExeTime
        - nsccParticipantId
        - npn
        - correlationId
      properties:
        # Event-level metadata
        eventType:
          type: string
          description: >
            Identifies the type of Day-2 confirmation event published to the event mesh.
          enum:
            - DAY2_CONFIRM
        eventId:
          type: string
          format: uuid
          maxLength: 36
          description: >
            Globally unique identifier for this event. Used by consuming systems for idempotent processing and duplicate detection.
        eventTimestamp:
          type: string
          format: date-time
          description: >
            Date and time when the event was published to the event mesh.
        associatedFirmId:
          type: string
          maxLength: 65
          description: >
            Query parameter for the associated firm ID (implementation-defined value) used to further identify a firm that is doing business on behalf of multiple distribution firms.

        # Day-2 business outcome data
        requestId:
          type: string
          description: >
            Server-assigned identifier for the arrangement request. Used to correlate the Day-1 request with the Day-2 confirmation.
        correlationId:
          type: string
          maxLength: 100
          description: >
            Correlation identifier supplied with the original request and propagated to the Day-2 confirmation for end-to-end traceability.
        policyNumber:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            Unique policy number.
        transactionType:
          type: string
          description: >
            High-level classification of the transaction that completed processing. For example, SUBMIT_* indicates creation of a new arrangement and UPDATE_* indicates modification of an existing arrangement. CANCEL_* indicates cancellation of an existing arrangement.
          enum:
            - SUBMIT_AUTO_REBALANCE
            - UPDATE_AUTO_REBALANCE
            - CANCEL_AUTO_REBALANCE
        status:
          type: string
          description: >
            Final processing outcome of the arrangement request.
          enum:
            - SUCCESS
            - SUCCESS_WITH_INFO
            - FAILURE
        message:
          type: string
          description: >
            Human-readable explanation of the outcome. Populated when the transaction fails or additional explanation is required.
        effectiveDate:
          type: string
          format: date
          description: >
              When the transaction was originally scheduled or expected to happen, can be a non-business day.
        npn:
          type: string
          maxLength: 100
          description: >
            The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
        nsccParticipantId:
          type: string
          maxLength: 100
          description: >
            Unique identifier assigned to the submitting firm or participant within the NSCC network for transaction routing and processing.
        transExeDate:
          type: string
          format: date
          description: >
            Date on which the Day‑2 confirmation was produced by the transaction processing system.
        transExeTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: >
            Time on which the Day-2 confirmation was produced by the transaction processing system.

    Error:
      type: object
      description: Standard error response envelope returned by this API.
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >
            A structured error code that uniquely identifies the type of error. This can follow a hierarchical format:
            - `<domain>`: The logical domain (e.g., "gateway")
            - `<category>`: The error category (e.g., "client" or "server")
            - `<subcategory>`: A specific error identifier (e.g., "badrequest", "timeout")
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
        message:
          type: string
          description: Message with specific error details.
        validationErrors:
          type: array
          description: Logical rule violations or decision failures related to business logic or rules
          items:
            type: object
            properties:
              code:
                type: string
                description: Code to classify the error & Identifies the type of business rule or decision failure.
              message:
                type: string
                description: Why the error occurred / Specific business rule violation
      required:
        - code
        - message
  
    GetArrangementRequestStatus:
        type: object
        description: >
          Current processing status of a previously submitted
          arrangement request
        properties:
          requestId:
            type: string
            description: >
              Server-assigned identifier for the arrangement request. Used to correlate the Day-1 request with the Day-2 confirmation.
          status:
            type: string
            description: >
              This is the mapping status description-A Day-1 response of ACCEPTED is reflected as IN_PROGRESS until processing completes. Upon completion, Day-2 statuses SUCCESS and SUCCESS_WITH_INFO are represented as polling status SUCCESS, while Day-2 status FAILURE is represented as polling status REJECTED.
            enum: [IN_PROGRESS, SUCCESS, REJECTED]
          effectiveDate:
            type: string
            description: >
              When the transaction was originally scheduled or expected to happen, can be a non-business day.
            format: date
          message:
            type: string
            description: >
              Optional informational or error message explaining the processing result.
        required: [requestId, status]