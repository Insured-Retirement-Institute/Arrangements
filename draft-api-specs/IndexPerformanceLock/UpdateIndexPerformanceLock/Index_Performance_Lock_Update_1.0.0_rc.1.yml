openapi: 3.1.0
info:
  title: Index Performance Lock Update Service
  version: 1.0.0_rc.1
  description: |
    API to update an existing Index Performance Lock arrangement against a policy.
    Requests are accepted asynchronously; a Day-1 acknowledgment (201) is returned with
    a Location header pointing to the arrangement-request polling resource. Final
    outcomes are delivered as Day-2 confirmation events on the event mesh.

paths:
  /v1/policies/{policyNumber}/arrangements/index-performance-lock/{arrangementId}:
    put:
      operationId: updateIndexPerformanceLock
      summary: Update an Index Performance Lock arrangement
      description: |
        Update an existing Index Performance Lock arrangement against the identified policy.
        The request is accepted for asynchronous processing; poll the arrangement-request
        resource returned in the Location header for status.
      tags:
        - Index Performance Lock
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AssociatedFirmId'
        - $ref: '#/components/parameters/ArrangementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIndexPerformanceLock'
            examples:
              updateUpsidePerformanceLock:
                summary: Update an upside performance lock with a threshold amount
                value:
                  effectiveDate: "2025-03-15"
                  nsccParticipantId: "1234"
                  cusip: "037833100"
                  actionIndicator: "O"
                  allocationOption: "SPECIFIED_FUNDS"
                  arrangement:
                    productCode: "IPL-VAR-01"
                    arrangementType: "PERFORMANCE_LOCK"
                    arrangementSubType: "UPSIDE_PERFORMANCE_LOCK"
                    startDate: "2025-04-01"
                  thresholdAmount: 25000.00
                  funds:
                    transferToFunds:
                      - fundId: "FND-INDEX-500"
                        requestedPercentage: 60
                      - fundId: "FND-INDEX-INTL"
                        requestedPercentage: 40
                  auditTransSummation:
                    auditTotalType: "SUM"
                    auditTotal: 100
                    correlationGuid: "5f9c1a2e-4b8d-4e2f-9b3a-6c7d8e9f0a1b"
                    correlationIdState: "INITIAL_USAGE"
                  parties:
                    - type: "INDIVIDUAL"
                      firstName: "Jane"
                      middleName: "Q"
                      lastName: "Doe"
                      taxId: "123456789"
                      relationships:
                        - OWNER
                  producer:
                    producerNumber: "P-000123"
                    npn: "12345678"
                    crdNumber: "9876543"
      responses:
        '202':
          description: Accepted — arrangement update request accepted for asynchronous processing.
          headers:
            Location:
              description: >
                URL of the arrangement-request status resource. Format: /v1/policies/{policyNumber}/arrangement-requests/{requestId}
              schema:
                type: string
                format: uri
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexPerformanceLockResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'

  /v1/policies/{policyNumber}/arrangement-requests/{requestId}:
    get:
      operationId: getArrangementRequestStatus
      summary: Retrieve arrangement request status
      description: Retrieve the current processing status of a previously submitted arrangement request.
      tags:
        - Arrangement Request Lifecycle
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - name: requestId
          in: path
          required: true
          description: Identifier returned in the Location header from the arrangement request POST/PUT.
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Arrangement request resource.
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArrangementRequestStatus'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  headers:
    correlationId:
      description: Correlates this response to requests and downstream logs.
      required: true
      schema:
        type: string
        maxLength: 100

  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
      description: Unique policy number.
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      description: >
        Identifier that enables the system to determine whether an arrangement already exists and supports subsequent updates, modifications, or termination of that arrangement.
      schema:
        type: string
        maxLength: 100
    CorrelationId:
      name: correlationId
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
      description: Unique identifier to trace the request.
    AssociatedFirmId:
      name: associatedFirmId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 65
      description: Associated firm identifier.

  responses:
    BadRequestError:
      description: Bad Request
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Unauthorized
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Forbidden
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Not Found
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowedError:
      description: Method Not Allowed
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptableError:
      description: Not Acceptable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Conflict
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Payload Too Large
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaTypeError:
      description: Unsupported Media Type
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: Unprocessable Entity
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: Too Many Requests
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGatewayError:
      description: Bad Gateway
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableError:
      description: Service Unavailable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeoutError:
      description: Gateway Timeout
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    UpdateIndexPerformanceLock:
      type: object
      description: |
        Request body to update an existing Index Performance Lock arrangement.
      required:
        - effectiveDate
        - nsccParticipantId
        - actionIndicator
        - arrangement
        - funds
        - producer
        - allocationOption
      properties:
        effectiveDate:
          type: string
          format: date
          description: When the transaction was originally scheduled or expected to happen; may be a non-business day.
        nsccParticipantId:
          type: string
          maxLength: 100
          description: Unique identifier for the NSCC participant.
        allocationOption:
          type: string
          description: >
            Defines the transaction allocation option for the arrangement transaction.
          const: SPECIFIED_FUNDS
        cusip:
          type: string
          pattern: '^[0-9]{3}[A-Z0-9]{5}[0-9]$'
          minLength: 9
          maxLength: 9
          description: Optional; REQUIRED only when policyNumber is not globally unique.
        actionIndicator:
          type: string
          description: Indicates the action to be taken.
          enum: [O, C]
        arrangement:
          $ref: '#/components/schemas/Arrangement'
        thresholdAmount:
          type: number
          minimum: 0
          maximum: 9999999999.99
          description: The target threshold amount for the upside or downside lock. Not used for On Demand Lock.
        funds:
          $ref: '#/components/schemas/Funds'
        auditTransSummation:
          $ref: '#/components/schemas/AuditTransSummation'
        parties:
          type: array
          description: Parties associated with the policy.
          items:
            $ref: '#/components/schemas/Party'
        producer:
          $ref: '#/components/schemas/Producer'
      allOf:
        - if:
            properties:
              arrangement:
                properties:
                  arrangementSubType:
                    const: UPSIDE_PERFORMANCE_LOCK
                required:
                  - arrangementSubType
            required:
              - arrangement
          then:
            required:
              - thresholdAmount
        - if:
            properties:
              arrangement:
                properties:
                  arrangementSubType:
                    const: DOWNSIDE_PERFORMANCE_LOCK
                required:
                  - arrangementSubType
            required:
              - arrangement
          then:
            required:
              - thresholdAmount
        - if:
            properties:
              arrangement:
                properties:
                  arrangementSubType:
                    const: ON_DEMAND_LOCK
                required:
                  - arrangementSubType
            required:
              - arrangement
          then:
            not:
              required:
                - thresholdAmount

    Arrangement:
      type: object
      description: Arrangement details describing the type, sub-type, product, and start date of the Index Performance Lock.
      required:
        - productCode
        - arrangementType
        - arrangementSubType
      properties:
        productCode:
          type: string
          maxLength: 100
          description: The carrier-assigned identifier for the arrangement option.
        arrangementType:
          type: string
          const: PERFORMANCE_LOCK
          description: Classifies the type of arrangement.
        arrangementSubType:
          type: string
          enum:
            - UPSIDE_PERFORMANCE_LOCK
            - DOWNSIDE_PERFORMANCE_LOCK
            - ON_DEMAND_LOCK
          description: >
            Granular classification of the arrangement type, used with arrangementType.
        startDate:
          type: string
          format: date
          description: On arrangement update, the date the arrangement should start.

    Funds:
      type: object
      description: Fund allocations associated with the performance lock arrangement.
      properties:
        transferToFunds:
          type: array
          description: Collection of destination fund allocations for the arrangement.
          items:
            $ref: '#/components/schemas/TransferToFund'

    TransferToFund:
      type: object
      description: A destination fund receiving allocation as part of the performance lock arrangement.
      required:
        - fundId
        - requestedPercentage
      properties:
        fundId:
          type: string
          maxLength: 100
          description: Unique identifier of the destination fund receiving the transfer.
        requestedPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: The percentage allocation requested for the destination fund allocation.
    AuditTransSummation:
      type: object
      description: Audit and correlation totals for the transaction batch.
      properties:
        auditTotalType:
          type: string
          description: > 
            Method used to summarize transaction values for audit purposes.
          enum: [COUNT, SUM, MEAN]
        auditTotal:
          type: number
          format: double
          minimum: 0
          description: > 
            Numeric value associated with the audit summary.
        correlationGuid:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          format: uuid
          description: > 
            Unique identifier used to correlate related transactions for audit and reconciliation.
        correlationIdState:
          type: string
          description: > 
            Lifecycle state associated with the correlation identifier.
          enum: [INITIAL_USAGE, ONGOING_USAGE, FINAL_USAGE]

    Party:
      type: object
      description: >
        Represents either an INDIVIDUAL or ENTITY associated with the policy and arrangement.
      anyOf:
        - $ref: '#/components/schemas/IndividualParty'
        - $ref: '#/components/schemas/EntityParty'

    IndividualParty:
      description: Schema for INDIVIDUAL party data
      type: object
      allOf:
        - $ref: '#/components/schemas/IndividualIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    EntityParty:
      description: Schema for entity party data
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    IndividualIdentity:
      description: Schema for INDIVIDUAL identity data
      required:
        - firstName
        - lastName
        - taxId
        - type
      type: object
      properties:
        type:
          description: Indicates the party is an INDIVIDUAL.
          type: string
          const: INDIVIDUAL
        firstName:
          description: First name of the party.
          type: string
          maxLength: 105
          pattern:  '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        middleName:
          description: Middle name of the party.
          type: string
          maxLength: 105
          pattern:  '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        lastName:
          description: Last name of the party.
          type: string
          maxLength: 105
          pattern:  '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        taxId:
          description: Tax Identification Number for the INDIVIDUAL party.
          type: string
          maxLength: 9

    PartyRelationship:
      description: Schema for party relationship data
      type: object
      required:
        - relationships
      properties:
        relationships:
          type: array
          description: >
            An array of strings specifying the relationship(s) of the party to the policy.
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [OWNER, JOINT_OWNER, ANNUITANT, JOINT_ANNUITANT, PRIMARY_BENEFICIARY, CONTINGENT_BENEFICIARY]

    EntityIdentity:
      description: Schema for entity identity data
      type: object
      required:
        - type
        - name
        - taxId
      properties:
        type:
          description: Indicates that the party is a legal entity.
          type: string
          const: ENTITY
        name:
          description: Legal name of the entity.
          type: string
          maxLength: 180
          pattern: '^[\w=()*@#\s.,''\/~%$!;:&"®`\\?\-]{1,180}$'
        taxId:
          description: Tax Identification Number of the entity.
          type: string
          maxLength: 9

    Producer:
      type: object
      description: Producer (licensed / appointed professional or firm) associated with the transaction.
      required:
        - npn
      properties:
        producerNumber:
          type: string
          maxLength: 100
          description: Carrier-assigned unique identifier.
        npn:
          type: string
          maxLength: 100
          description: National Producer Number.
        crdNumber:
          type: string
          maxLength: 100
          description: Central Registration Depository number.
    IndexPerformanceLockResponse:
      type: object
      description: Day-1 acknowledgment response for an Index Performance Lock update. The request has been accepted for asynchronous processing.
      required:
        - requestId
        - status
      properties:
        requestId:
          type: string
          description: >
            Server-assigned identifier for this submission. Carried forward
            into the Day-2 confirmation event so consumers can correlate
            Day-1 and Day-2.
        status:
          type: string
          const: ACCEPTED
          description: Synchronous-tier outcome.
        message:
          type: string
          description: Optional informational message related to request submission.
        effectiveDate:
          type: string
          format: date
          description: >
            When the transaction was originally scheduled or expected to happen; can be a non-business day.
    GetArrangementRequestStatus:
      type: object
      description: Status of a previously submitted arrangement request.
      required:
        - requestId
        - status
      properties:
        requestId:
          type: string
          description: Server-assigned identifier for the arrangement request.
        status:
          type: string
          enum: [IN_PROGRESS, SUCCESS, REJECTED]
          description: Current processing status of the arrangement request.
        message:
          type: string
          description: >
            Optional informational or error message explaining the
            processing result.
        effectiveDate:
          type: string
          format: date
          description: >
            When the transaction was originally scheduled or expected to happen; can be a non-business day.
    Error:
      type: object
      description: Standard IRI error payload returned by error responses.
      required:
        - code
        - message
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error.
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >
            A structured error code that uniquely identifies the type of error. This can follow a hierarchical format:
            - `<domain>`: The logical domain (e.g., "gateway")
            - `<category>`: The error category (e.g., "client" or "server")
            - `<subcategory>`: A specific error identifier (e.g., "badrequest", "timeout")
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred.
        message:
          type: string
          description: Message with specific error details.
        validationErrors:
          type: array
          description: Logical rule violations or decision failures related to business logic or rules.
          items:
            type: object
            properties:
              code:
                type: string
                description: Code that classifies the error and identifies the type of business rule or decision failure.
              message:
                type: string
                description: Why the error occurred / Specific business rule violation.
    Day2ArrangementConfirmationEvent:
      x-event-mesh:
        broker: Advanced Event Mesh
        topicPattern: "{root}/ift/v1/{eventType}/{status}/{transactionType}/{firm}"
        deliveryModel: topic-subscription
        note: >
          Delivered over a message broker via topic subscription, not an HTTP
          callback.
      type: object
      description: >
          Canonical Day-2 arrangement confirmation event published to the enterprise event mesh after an arrangement transaction completes processing.
      required:
        - eventType
        - eventId
        - eventTimestamp
        - associatedFirmId
        - requestId
        - policyNumber
        - transactionType
        - status
        - transExeDate
        - transExeTime
        - nsccParticipantId
        - npn
        - correlationId
      properties:
        # Event-level metadata
        eventType:
          type: string
          description: >
            Identifies the type of Day-2 confirmation event published to
            the event mesh. 
          enum:
            - DAY2_CONFIRM
        eventId:
          type: string
          format: uuid
          maxLength: 36
          description: >
            Globally unique identifier for this event. Used by consuming
            systems for idempotent processing and duplicate detection.
        eventTimestamp:
          type: string
          format: date-time
          description: >
            Date and time when the event was published to the event mesh.
        associatedFirmId:
          type: string
          maxLength: 65
          description: >
            Firm identifier associated with the transaction.
        # Day-2 business outcome data
        requestId:
          type: string
          description: >
            Identifier assigned when the arrangement request was submitted.
            Used to correlate the Day-2 confirmation with the original
            Day-1 request.
        correlationId:
          type: string
          maxLength: 100
          description: >
            Correlation identifier supplied with the original
            request and propagated to the Day-2 confirmation for
            end-to-end traceability.
        policyNumber:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            Policy number associated with the arrangement request.
        transactionType:
          type: string
          enum:
            - UPDATE_INDEX_PERFORMANCE_LOCK
            - SUBMIT_INDEX_PERFORMANCE_LOCK
            - CANCEL_INDEX_PERFORMANCE_LOCK
          description: >
            High-level classification of the transaction that completed
            processing. For example, SUBMIT_* indicates creation of a new arrangement and UPDATE_* indicates modification of an existing arrangement.
            CANCEL_* indicates cancellation of an existing arrangement.
        status:
          type: string
          description: >
            Final processing outcome of the arrangement request.
          enum:
            - SUCCESS
            - SUCCESS_WITH_INFO
            - FAILURE
        message:
          type: string
          description: >
            Human-readable explanation of the outcome. Populated when the transaction fails or additional explanation is required.
        effectiveDate:
          type: string
          format: date
          description: >
            Effective date of the arrangement on the policy, when applicable.
        npn:
          type: string
          maxLength: 100
          description: >
            National Producer Number associated with the transaction,
            when available.
        nsccParticipantId:
          type: string
          maxLength: 100
          description: >
            Unique identifier assigned to the submitting firm or participant within the NSCC network for transaction routing and processing.
        transExeDate:
          type: string
          format: date
          description: >
            Date on which the Day‑2 confirmation was produced by the
            transaction processing system.
        transExeTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: >
            Time on which the Day-2 confirmation was produced by the
            transaction processing system.