openapi: 3.1.0
info:
  title: Systematic Investment Service
  version: 1.0.0_rc.1
  description: API to submit Systematic Investment transactions.

paths:
  /v1/policies/{policyNumber}/arrangements/systematic-investment:
    post:
      operationId: submitSystematicInvestment
      description: |
        Submit a new Systematic Investment arrangement against the identified policy.
      tags:
        - Systematic Investment
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AssociatedFirmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSystematicInvestmentRequest'
            examples:
              SystematicInvestment_Submit_Example_Full:
                value:
                  effectiveDate: 2026-06-15
                  externalArrangementId: "SystematicInvestment-EXT-20260615-001"
                  nsccParticipantId: "NSCC998877"
                  cusip: "123AB4567"
                  actionIndicator: "N"
                  arrangement:
                    productCode: "SystematicInvestment-001"
                    arrangementType: "SYSTEMATIC_INVESTMENT"
                    arrangementSubType: "STANDARD_AUTO_PAY"
                    startDate: 2026-06-15
                    endDate: 2030-06-15
                    destinationTransferAmountType: "AMOUNT"
                    frequency: "MONTHLY"
                  funds:
                    transferToFunds:
                      - fundId: "DST-FUND-101"
                        requestedAmount: 600.00
                  auditTransSummation:
                    auditTotalType: "SUM"
                    auditTotal: 1000.00
                    correlationGuid: "123e4567-e89b-12d3-a456-426614174000"
                    correlationIdState: "INITIAL_USAGE"
                  payer:
                    type: INDIVIDUAL
                    firstName: "John"
                    middleName: "A"
                    lastName: "Doe"
                    taxId: "123456789"
                  producer:
                    producerNumber: "456789"
                    npn: "123456"
                    crdNumber: "654321"

      responses:
        '201':
          description: |
            Created — SystematicInvestment arrangement request accepted for processing.
          headers:
            Location:
              description: >
                URL of the arrangement-request status resource created for this submission.
                Format: /v1/policies/{policyNumber}/arrangement-requests/{requestId}
              schema:
                type: string
                format: uri
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystematicInvestmentResponse'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '405': { $ref: '#/components/responses/MethodNotAllowedError' }
        '406': { $ref: '#/components/responses/NotAcceptableError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaTypeError' }
        '422': { $ref: '#/components/responses/UnprocessableEntityError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGatewayError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
        '504': { $ref: '#/components/responses/GatewayTimeoutError' }

  /v1/policies/{policyNumber}/arrangement-requests/{requestId}:
    get:
      operationId: getArrangementRequest
      tags:
        - Arrangement Request Lifecycle
      description: >
        Retrieve the current processing status of a previously submitted
        arrangement request. This endpoint allows clients to poll for
        status updates until the transaction reaches a final outcome.
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - name: requestId
          in: path
          required: true
          description: >
            Identifier returned in the Location header from the arrangement request POST.
          schema:
            type: string
      responses:
        '200':
          description: Arrangement request resource.
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArrangementRequestStatus'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  headers:
    correlationId:
      description: Correlates this response to requests and downstream logs.
      required: true
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequestError:
      description: Bad Request
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Unauthorized
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Forbidden
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Not Found
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowedError:
      description: Method Not Allowed
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptableError:
      description: Not Acceptable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Conflict
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Payload Too Large
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaTypeError:
      description: Unsupported Media Type
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: Unprocessable Entity
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: Too Many Requests
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGatewayError:
      description: Bad Gateway
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableError:
      description: Service Unavailable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeoutError:
      description: Gateway Timeout
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      description: Unique policy number
      schema:
        type: string
        minLength: 1
        maxLength: 30
    CorrelationId:
      name: correlationId
      in: header
      required: true
      description: Unique identifier to trace the request
      schema:
        type: string
        maxLength: 100
    AssociatedFirmId:
      name: associatedFirmId
      in: query
      required: true
      description: Associated firm identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 65

  schemas:
    SubmitSystematicInvestmentRequest:
      type: object
      required:
        - effectiveDate
        - externalArrangementId
        - actionIndicator
        - nsccParticipantId
        - producer
        - arrangement
      properties:
        effectiveDate:
          type: string
          description: > 
            When the transaction was originally scheduled or expected to happen, can be a non-business day.
          format: date
        nsccParticipantId:
          type: string
          description: > 
            Unique identifier assigned to the submitting firm or participant within the NSCC network.
          maxLength: 100
        externalArrangementId:
          type: string
          description: > 
            Client-assigned identifier used to correlate the arrangement across systems.
          maxLength: 100
        cusip:
          type: string
          description: > 
            Unique identification code for the security. Required when the policy number is not globally unique.
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{3}[A-Z0-9]{5}[0-9]$
        actionIndicator:
          type: string
          const: N
          description: >
              Action to perform on the arrangement.
              N = New arrangement submission.
        arrangement:
          description: > 
            Arrangement details associated with the Systematic Investment transaction.
          allOf:
           - $ref: '#/components/schemas/Arrangement'
        funds:
          description: >
            Identifies the destination fund allocations that participate in the
            Systematic Investment arrangement.

            Fund allocations are required when
            arrangement.destinationTransferAmountType is AMOUNT or PERCENT.

            For STANDING_ALLOCATION, PRO_RATA_VARIABLE_FUNDS, and
            PRO_RATA_ALL_FUNDS, destination allocations are derived from existing
            policy allocations and the funds object must not be supplied.

            When destinationTransferAmountType is AMOUNT, each fund entry must
            provide requestedAmount.

            When destinationTransferAmountType is PERCENT, each fund entry must
            provide requestedPercentage.
          allOf:
            - $ref: '#/components/schemas/Funds'
        auditTransSummation:
          description: > 
            Summary information used to audit one or more transactions.
          allOf:
            - $ref: '#/components/schemas/AuditTransSummation'
        payer:
          description: > 
            Identifies the individual or entity responsible for providing funds for the Systematic Investment arrangement.
          allOf:
            - $ref: '#/components/schemas/Payer'
        producer:
          description: > 
            Information about the producer submitting the request.
          allOf:
            - $ref: '#/components/schemas/Producer'
      allOf:
        - if:
            properties:
              arrangement:
                properties:
                  destinationTransferAmountType:
                    enum:
                      - AMOUNT
                      - PERCENT
          then:
            required:
              - funds

        - if:
            properties:
              arrangement:
                properties:
                  destinationTransferAmountType:
                    enum:
                      - STANDING_ALLOCATION
                      - PRO_RATA_VARIABLE_FUNDS
                      - PRO_RATA_ALL_FUNDS
          then:
            not:
              required:
                - funds

        - if:
            properties:
              arrangement:
                properties:
                  destinationTransferAmountType:
                    const: AMOUNT
          then:
            properties:
              funds:
                properties:
                  transferToFunds:
                    items:
                      required:
                        - requestedAmount
                      not:
                        required:
                          - requestedPercentage

        - if:
            properties:
              arrangement:
                properties:
                  destinationTransferAmountType:
                    const: PERCENT
          then:
            properties:
              funds:
                properties:
                  transferToFunds:
                    items:
                      required:
                        - requestedPercentage
                      not:
                        required:
                          - requestedAmount
    Arrangement:
      type: object
      required:
        - productCode
        - arrangementType
        - frequency
        - startDate
        - destinationTransferAmountType
      properties:
        productCode:
          type: string
          description: > 
            Carrier-assigned identifier for the Systematic Investment product or arrangement option.
          maxLength: 100
        arrangementType:
          type: string
          description: > 
            Classifies the type of arrangement being established.
          const: SYSTEMATIC_INVESTMENT
        arrangementSubType:
          type: string
          description: > 
            Subclassification that refines the arrangement type.
          const: STANDARD_AUTO_PAY
        startDate:
          type: string
          description: > 
            Date on which the Systematic Investment arrangement begins.
          format: date
        endDate:
          type: string
          format: date
          description: the date the arrangement should end.
        destinationTransferAmountType:
          type: string
          description: > 
            Indicates how destination investment allocations are defined for the arrangement.
          enum: [AMOUNT, PERCENT, STANDING_ALLOCATION, PRO_RATA_VARIABLE_FUNDS, PRO_RATA_ALL_FUNDS]
        frequency:
          type: string
          description: > 
            Frequency at which investments are scheduled to occur.
          enum: [DAILY, EVERY_TWO_WEEKS, MONTHLY, SEMI_ANNUAL, QUARTERLY, ANNUAL]

    Funds:
      type: object
      description: >
        Container schema for destination fund allocations participating in
        a Systematic Investment arrangement. Present only when
        destinationTransferAmountType is AMOUNT or PERCENT.
      required:
        - transferToFunds
      properties:
        transferToFunds:
          type: array
          description: > 
            List of destination funds that receive investment allocations.
          minItems: 1
          items:
            $ref: '#/components/schemas/FundItem'

    FundItem:
      type: object
      description: >
        Represents a single destination fund participating in the
        Systematic Investment arrangement.

        Exactly one of requestedAmount or requestedPercentage
        must be supplied.

        requestedAmount is used when
        arrangement.destinationTransferAmountType is AMOUNT.

        requestedPercentage is used when
        arrangement.destinationTransferAmountType is PERCENT.
      required:
        - fundId
      properties:
        fundId:
          type: string
          description: > 
            Unique identifier of the destination fund receiving investment allocations.
          maxLength: 100
        requestedAmount:
          type: number
          description: > 
            Dollar amount to be allocated to the destination fund.
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        requestedPercentage:
          type: number
          description: > 
            Percentage allocation to be applied to the destination fund.
          minimum: 0
          maximum: 100
      oneOf:
        - required: [requestedAmount]
          not:
            required: [requestedPercentage]

        - required: [requestedPercentage]
          not:
            required: [requestedAmount]

    AuditTransSummation:
      type: object
      properties:
        auditTotalType:
          type: string
          description: > 
            Method used to summarize transaction values for audit purposes.
          enum: [COUNT, SUM, MEAN]
        auditTotal:
          type: number
          format: double
          description: > 
            Numeric value associated with the audit summary.
          minimum: 0
        correlationGuid:
          type: string
          description: > 
            Unique identifier used to correlate related transactions for audit and reconciliation.
          format: uuid
        correlationIdState:
          type: string
          description: > 
            Lifecycle state associated with the correlation identifier.
          enum: [INITIAL_USAGE, ONGOING_USAGE, FINAL_USAGE]

    Producer:
      type: object
      required:
        - npn
      properties:
        producerNumber:
          type: string
          description: > 
            Carrier-assigned unique identifier for the producer.
          maxLength: 100
        npn:
          type: string
          description: > 
            National Producer Number associated with the producer.
          maxLength: 100
        crdNumber:
          type: string
          description: >
            Central Registration Depository number associated with the producer.
          maxLength: 100

    Payer:
      type: object
      description: |
        the individual or entity responsible for providing the funds for the systematic investment arrangement.
      anyOf:
        - $ref: '#/components/schemas/IndividualPayer'
        - $ref: '#/components/schemas/EntityPayer'          

    PayerExtension:
      type: object
      description: |
        Bank and address details for the systematic investment arrangement.
      properties:
          bank:
            $ref: '#/components/schemas/Bank'
          address:
            $ref: '#/components/schemas/Address'

    IndividualPayer:
      description: Schema for individual payer data
      type: object
      allOf:
        - $ref: '#/components/schemas/IndividualIdentity'
        - $ref: '#/components/schemas/PayerExtension'

    EntityPayer:
      description: Schema for entity payer data
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityIdentity'
        - $ref: '#/components/schemas/PayerExtension'

    IndividualIdentity:
      description: >
        Schema for individual identity information.
      required: [firstName, lastName, taxId,type]
      type: object
      properties:
        type:
          type: string
          description: > 
            Indicates that the payer is an individual.
          const: INDIVIDUAL
        firstName:
          type: string
          description: > 
            First name of the payer.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        middleName:
          type: string
          description: > 
            Middle name of the payer.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        lastName:
          type: string
          description: > 
            Last name of the payer.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        taxId:
          type: string
          description: > 
            Tax Identification Number of the payer.
          maxLength: 9

    EntityIdentity:
      description: >
        Schema for entity identity information.
      type: object
      required: [type, name, taxId]
      properties:
        type:
          type: string
          description: > 
            Indicates that the payer is a legal entity.
          const: ENTITY
        name:
          type: string
          description: > 
            Legal name of the payer entity.
          minLength: 1
          maxLength: 180
          pattern: '^[\w=()*@#\s.,''\/~%$!;:&"®`\\?\-]{1,180}$'
        taxId:
          type: string
          description: > 
            Tax Identification Number of the payer entity.
          maxLength: 9
    
    Address:
      type: object
      properties:
        addressId:
          type: string
          description: > 
            Unique identifier for the address.
          maxLength: 100
        addressType:
          type: string
          description: > 
            Type of address associated with the payer.
          enum: [RESIDENCE, BUSINESS, PO_BOX_SEASONAL, APO, DPO, FPO]
          maxLength: 30
        addressLine1:
          type: string
          description: > 
            First line of the address.
          maxLength: 100
        addressLine2:
          type: string
          description: > 
            Second line of the address.
          maxLength: 100
        addressLine3:
          type: string
          description: > 
            Third line of the address.
          maxLength: 100
        addressLine4:
          type: string
          description: > 
            Fourth line of the address.
          maxLength: 100
        addressLine5:
          type: string
          description: > 
            Fifth line of the address.
          maxLength: 100
        city:
          type: string
          description: > 
            City name.
          maxLength: 100
        state:
          type: string
          description: > 
            State or province code.
          maxLength: 2
          pattern: "^[A-Z]{2}$"
        zipCode:
          type: string
          description: > 
            ZIP or postal code.
          maxLength: 10
          pattern: "^[0-9A-Za-z -]{3,10}$"
        zipCodeExtension:
          type: string
          description: > 
            ZIP code extension.
          maxLength: 4
          pattern: "^[0-9A-Za-z]{1,4}$"
        country:
          type: string
          description: > 
            Country code.
          maxLength: 2
          pattern: "^[A-Z]{2}$"
      required:
        - addressType
        - addressLine1
        - city
        - state
        - zipCode

    Bank:
      type: object
      properties:
        bankId:
          type: string
          description: > 
            Identifier of the bank account record.
          maxLength: 100
        nameOnAccount:
          type: string
          description: > 
            Name registered on the bank account.
          maxLength: 100
        accountStatus:
          type: string
          description: > 
            Current status of the bank account.
          enum: [ACTIVE_BANK_ACCOUNT, TERMINATED_BANK_ACCOUNT]
        accountType:
          type: string
          description: > 
            Type of bank account used for funding.
          enum: [CHECKING, SAVINGS, CREDIT_CARD_ACCOUNT, DEBIT_CARD_ACCOUNT, BROKERAGE_ACCOUNT, CERTIFICATE_OF_DEPOSIT_ACCOUNT]
        accountNumber:
          type: string
          description: > 
            Bank account number used for funding transactions.
          maxLength: 17
          pattern: '^\d{4,17}$'
        routingNumber:
          type: string
          description: > 
            Routing number of the financial institution.
          maxLength: 9
          pattern: '^\d{9}$'
        branchName:
          type: string
          description: > 
            Name of the bank branch.
          maxLength: 100
      required:
        - nameOnAccount
        - accountType
        - accountNumber
        - routingNumber

    SystematicInvestmentResponse:
      description: Synchronous Day-1 response to a SystematicInvestment submission.
      type: object
      required:
        - status
        - requestId
      properties:
        requestId:
          description: |
           Server-assigned identifier for this submission. Carried forward
            into the Day-2 confirmation event so consumers can correlate
            Day-1 and Day-2.
          type: string
        status:
          description: Synchronous-tier outcome.
          type: string
          const: CREATED
        message:
          description: Optional informational message related to request submission.
          type: string
          maxLength: 500
        effectiveDate:
          type: string
          format: date
          description: When the transaction was originally scheduled or expected to happen, can be a non-business day.

    Day2ArrangementConfirmationEvent:
      x-event-mesh:
        broker: Advanced Event Mesh
        topicPattern: "{root}/ift/v1/{eventType}/{status}/{transactionType}/{firm}"
        deliveryModel: topic-subscription
        note: >
          Delivered over a message broker via topic subscription, not an HTTP
          callback. 
      type: object
      description: >
        Canonical Day-2 arrangement confirmation event published to the enterprise event mesh after an arrangement transaction completes processing.
      required:
        - eventType
        - eventId
        - eventTimestamp
        - associatedFirmId
        - requestId
        - policyNumber
        - transactionType
        - status
        - transExeDate
        - transExeTime
        - nsccParticipantId
        - npn
        - correlationId
      properties:
        # Event-level metadata
        eventType:
          type: string
          description: >
            Identifies the type of Day-2 confirmation event published to
            the event mesh. 
          enum:
            - DAY2_CONFIRM
        eventId:
          type: string
          format: uuid
          maxLength: 36
          description: >
            Globally unique identifier for this event. Used by consuming
            systems for idempotent processing and duplicate detection.
        eventTimestamp:
          type: string
          format: date-time
          description: >
            Date and time when the event was published to the event mesh.
        associatedFirmId:
          type: string
          maxLength: 65
          description: >
            Firm identifier associated with the transaction.

        # Day-2 business outcome data
        requestId:
          type: string
          description: >
            Identifier assigned when the arrangement request was submitted.
            Used to correlate the Day-2 confirmation with the original
            Day-1 request.
        correlationId:
          type: string
          maxLength: 100
          description: >
            Correlation identifier supplied with the original
            request and propagated to the Day-2 confirmation for
            end-to-end traceability.
        policyNumber:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            Policy number associated with the arrangement request.
        transactionType:
          type: string
          enum:
            - SUBMIT_SYSTEMATIC_INVESTMENT
            - UPDATE_SYSTEMATIC_INVESTMENT
            - CANCEL_SYSTEMATIC_INVESTMENT
          description: >
            High-level classification of the transaction that completed
            processing.For example, SUBMIT_* indicates creation of a new arrangement ;UPDATE_* indicates modification of an existing arrangement;CANCEL_* indicates cancellation of an existing arrangement.
        status:
          type: string
          description: >
            Final processing outcome of the arrangement request.
          enum:
            - SUCCESS
            - SUCCESS_WITH_INFO
            - FAILURE
        message:
          type: string
          description: >
            Human-readable explanation of the outcome. Populated when the transaction fails or additional explanation is required.
        effectiveDate:
          type: string
          format: date
          description: >
             Effective date of the arrangement on the policy, when applicable.
        npn:
          type: string
          maxLength: 100
          description: >
            National Producer Number associated with the transaction,
            when available.
        nsccParticipantId:
          type: string
          maxLength: 100
          description: >
            Unique identifier assigned to the submitting firm or participant within the NSCC network for transaction routing and processing.
        transExeDate:
          type: string
          format: date
          description: >
            Date on which the Day‑2 confirmation was produced by the
            transaction processing system.
        transExeTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: >
            Time on which the Day-2 confirmation was produced by the
            transaction processing system.

    Error:
      type: object
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >
            A structured error code that uniquely identifies the type of error. This can follow a hierarchical format:
            - `<domain>`: The logical domain (e.g., "gateway")
            - `<category>`: The error category (e.g., "client" or "server")
            - `<subcategory>`: A specific error identifier (e.g., "badrequest", "timeout")
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
        message:
          type: string
          description: Message with specific error details.
        validationErrors:
          type: array
          description: Logical rule violations or decision failures related to business logic or rules
          items:
            type: object
            properties:
              code:
                type: string
                description: Code to classify the error & Identifies the type of business rule or decision failure.
              message:
                type: string
                description: Why the error occurred / Specific business rule violation
      required:
        - code
        - message
  
    GetArrangementRequestStatus:
        type: object
        description: >        
          Current processing status of a previously submitted arrangement request.
        properties:
          requestId:
            type: string
            description: Server-assigned identifier for the arrangement request.
          status:
            type: string
            description: Current status of the arrangement request.
            enum: [IN_PROGRESS, SUCCESS, REJECTED]
          effectiveDate:
            type: string
            format: date
            description: When the transaction was originally scheduled or expected to happen, can be a non-business day.
          message:
            type: string
            description: >
              Optional informational or error message explaining the
              processing result.
        required: [requestId, status]