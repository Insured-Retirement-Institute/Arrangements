openapi: 3.1.0
info:
  title: Allocation Instructions Service
  version: 1.0.0_rc.1
  description: API for updating Allocation Instructions arrangements associated with a policy.

paths:
  /v1/policies/{policyNumber}/arrangements/allocation-instructions/{arrangementId}:
    put:
      operationId: updateAllocationInstructions
      description: |
        Update an Allocation Instructions arrangement for the identified policy.
      tags:
        - Allocation Instructions
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AssociatedFirmId'
        - $ref: '#/components/parameters/ArrangementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAllocationInstructionsRequest'
            examples:
              AI_Update_Example:
                value:
                  effectiveDate: "2026-06-15"
                  nsccParticipantId: "NSCC998877"
                  cusip: "123AB4567"
                  actionIndicator: "O"
                  arrangement:
                    productCode: "AI-001"
                    arrangementType: "ALLOCATION_INSTRUCTIONS"
                    arrangementSubType: "STANDING_ALLOCATION"
                  funds:
                    transferFromFunds:
                      - fundId: "SRC-FUND-001"
                        requestedPercentage: 100
                    transferToFunds:
                      - fundId: "DST-FUND-101"
                        requestedPercentage: 100
                  auditTransSummation:
                    auditTotalType: "SUM"
                    auditTotal: 1000.00
                    correlationGuid: "123e4567-e89b-12d3-a456-426614174000"
                    correlationIdState: "INITIAL_USAGE"
                  parties:
                    - type: INDIVIDUAL
                      firstName: "John"
                      middleName: "A"
                      lastName: "Doe"
                      taxId: "123456789"
                      relationships:
                        - OWNER
                  producer:
                    producerNumber: "456789"
                    npn: "123456"
                    crdNumber: "654321"

      responses:
        '202':
          description: |
            Accepted — request accepted for processing.
          headers:
            Location:
              description: >
                URL of the arrangement request status resource for this update operation.
                Format: /v1/policies/{policyNumber}/arrangement-requests/{requestId}
              schema:
                type: string
                format: uri
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationInstructionsResponse'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '405': { $ref: '#/components/responses/MethodNotAllowedError' }
        '406': { $ref: '#/components/responses/NotAcceptableError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaTypeError' }
        '422': { $ref: '#/components/responses/UnprocessableEntityError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGatewayError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
        '504': { $ref: '#/components/responses/GatewayTimeoutError' }

  /v1/policies/{policyNumber}/arrangement-requests/{requestId}:
    get:
      operationId: getArrangementRequest
      tags:
        - Arrangement Request Lifecycle
      description: >
        Retrieve the current processing status of a previously updated
        arrangement request. This endpoint allows clients to poll for
        status updates until the transaction reaches a final outcome.
      parameters:
        - $ref: '#/components/parameters/PolicyNumber'
        - name: requestId
          in: path
          required: true
          description: >
            Identifier returned in the Location header from the arrangement request PUT.
          schema:
            type: string
      responses:
        '200':
          description: Arrangement request resource.
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArrangementRequestStatus'
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  headers:
    correlationId:
      description: Correlates this response to requests and downstream logs.
      required: true
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequestError:
      description: Bad Request
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Unauthorized
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Forbidden
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Not Found
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowedError:
      description: Method Not Allowed
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptableError:
      description: Not Acceptable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Conflict
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Payload Too Large
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaTypeError:
      description: Unsupported Media Type
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: Unprocessable Entity
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: Too Many Requests
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGatewayError:
      description: Bad Gateway
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableError:
      description: Service Unavailable
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeoutError:
      description: Gateway Timeout
      headers:
        correlationId:
          $ref: '#/components/headers/correlationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
    CorrelationId:
      name: correlationId
      in: header
      required: true
      description: Unique identifier to trace the request
      schema:
        type: string
        maxLength: 100
    AssociatedFirmId:
      name: associatedFirmId
      in: query
      required: true
      description: Associated firm identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 65
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      description: >
        Identifier used enables the system to determine whether an arrangement already exists and supports subsequent updates, modifications, or termination of that arrangement.
      schema:  
        type: string
        minLength: 1
        maxLength: 100
  schemas:
    UpdateAllocationInstructionsRequest:
      type: object
      required:
        - effectiveDate
        - actionIndicator
        - nsccParticipantId
        - arrangement
        - producer
        - funds
      properties:
        effectiveDate:
          type: string
          format: date
          description: When the transaction was originally scheduled or expected to happen; may be a non-business day.
        nsccParticipantId:
          type: string
          maxLength: 100
        cusip:
          type: string
          description: >
            Security CUSIP identifier for the arrangement.
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{3}[A-Z0-9]{5}[0-9]$
        actionIndicator:
          type: string
          enum: [O, C]
          description: >
            Indicates the action to be performed on the arrangement.
            - O = Override/Update
            - C = Cancel
            For MATURING_INDEX_INSTRUCTIONS, only C is allowed.
            For STANDING_ALLOCATION and CURRENT_ALLOCATION, only O is allowed.
        arrangement:
          description: >
            Allocation instruction arrangement details.
          allOf:
            - $ref: '#/components/schemas/Arrangement'
        funds:
          description: >
            Defines the destination fund allocation instructions for the arrangement.
          allOf:
            - $ref: '#/components/schemas/Funds'
        auditTransSummation:
          description: >
            Audit and reconciliation information for the transaction.
          allOf:
            - $ref: '#/components/schemas/AuditTransSummation'
        parties:
          type: array
          description: >
            Policy parties associated with the arrangement.
          items:
            $ref: '#/components/schemas/Party'
        producer:
          description: >
            Producer information associated with the arrangement update.
          allOf:
            - $ref: '#/components/schemas/Producer'
      allOf: 
        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    enum: 
                      - STANDING_ALLOCATION
                      - CURRENT_ALLOCATION
          then:
            properties:
              funds:
                required:
                  - transferFromFunds
        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    const: MATURING_INDEX_INSTRUCTIONS
          then:
            properties:
              funds:
                required:
                  - openDate
                  - transferFromFunds

        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    const: MATURING_INDEX_INSTRUCTIONS
          then:
            properties:
              actionIndicator:
                const: C
        - if:
            required:
              - arrangement
            properties:
              arrangement:
                required:
                  - arrangementSubType
                properties:
                  arrangementSubType:
                    enum:
                      - STANDING_ALLOCATION
                      - CURRENT_ALLOCATION
          then:
            properties:
              actionIndicator:
                const: O
    Arrangement:
      type: object
      required:
        - productCode
        - arrangementType
        - arrangementSubType
      properties:
        productCode:
          type: string
          description: >
            Carrier-assigned identifier for the arrangement option.
          maxLength: 100
        arrangementType:
          type: string
          description: >
            Classification of the arrangement.
          const: ALLOCATION_INSTRUCTIONS
        arrangementSubType:
          type: string
          description: >
            Allocation instruction processing mode.
            - STANDING_ALLOCATION
            - CURRENT_ALLOCATION
            - MATURING_INDEX_INSTRUCTIONS
          enum: [STANDING_ALLOCATION, CURRENT_ALLOCATION, MATURING_INDEX_INSTRUCTIONS]
        
    Funds:
      type: object
      required:
        - transferToFunds
      properties:
        openDate:
          type: string
          description: >
            Date the source fund or indexed strategy was originally opened.
          format: date
        transferFromFunds:
          type: array
          description: >
            Source funds from which value will be transferred.
          minItems: 1
          items:
            $ref: '#/components/schemas/FundItem'
        transferToFunds:
          minItems: 1
          type: array
          description: >
            Destination funds receiving the allocation.
            The sum of all requestedPercentage values must equal 100 percent.
            Enforced through business validation.
          items:
            $ref: '#/components/schemas/FundItem'

    FundItem:
      type: object
      required:
        - fundId
        - requestedPercentage
      properties:
        fundId:
          type: string
          description: >
            Identifier of the participating fund.
          maxLength: 100
        requestedPercentage:
          type: number
          description: >
            Percentage allocated to the fund.
          minimum: 0
          maximum: 100

    AuditTransSummation:
      type: object
      description: Audit metadata used to summarize and correlate the transaction.
      properties:
        auditTotalType:
          type: string
          description: > 
            Method used to summarize transaction values for audit purposes.
          enum: [COUNT, SUM, MEAN]
        auditTotal:
          type: number
          format: double
          minimum: 0
          description: The numeric value for the total.
        correlationGuid:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: > 
            Unique identifier used to correlate related transactions for audit and reconciliation.
          format: uuid
        correlationIdState:
          type: string
          description: > 
            Lifecycle state associated with the correlation identifier.
          enum: [INITIAL_USAGE, ONGOING_USAGE, FINAL_USAGE]

    Producer:
      type: object
      required:
        - npn
      properties:
        producerNumber:
          type: string
          description: >
            Carrier-assigned producer identifier.
          maxLength: 100
        npn:
          type: string
          description: >
            National Producer Number.
          maxLength: 100
        crdNumber:
          type: string
          description: >
            Central Registration Depository number.
          maxLength: 100

    Party:
      type: object
      description: |
        The parties object represents the policy parties relevant to the arrangement (owners, annuitants, beneficiaries, etc.), along with their identity, relationship, and payout instructions.
      anyOf:
          - $ref: '#/components/schemas/IndividualParty'
          - $ref: '#/components/schemas/EntityParty'

    IndividualParty:
      description: Schema for individual party data
      type: object
      allOf:
        - $ref: '#/components/schemas/IndividualIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    EntityParty:
      description: Schema for entity party data
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    IndividualIdentity:
      description: Schema for individual identity data
      required: [firstName, lastName, taxId, type]
      type: object
      properties:
        type:
          type: string
          description: >
            Identifies the party as an individual.
          const: INDIVIDUAL
        firstName:
          type: string
          description: >
            First name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        middleName:
          type: string
          description: >
            Middle name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        lastName:
          type: string
          description: >
            Last name of the individual.
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        taxId:
          type: string
          description: >
            Tax identification number of the individual.
          maxLength: 9

    EntityIdentity:
      description: Schema for entity identity data
      type: object
      required: [type, name, taxId]
      properties:
        type:
          type: string
          description: >
            Identifies the party as an entity.
          const: ENTITY
        name:
          type: string
          description: >
            Legal entity name.
          pattern: '^[\w=()*@#\s.,''\/~%$!;:&"®`\\?\-]{1,180}$'
          maxLength: 180
        taxId:
          type: string
          description: >
            Tax identification number of the entity.
          maxLength: 9

    PartyRelationship:
      description: Schema for party relationship data
      type: object
      required: [relationships]
      properties:
        relationships:
          type: array
          description: >
            Relationship of the party to the policy.
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum:
              - OWNER
              - JOINT_OWNER
              - ANNUITANT
              - JOINT_ANNUITANT
              - PRIMARY_BENEFICIARY
              - CONTINGENT_BENEFICIARY
    
    AllocationInstructionsResponse:
      description: Synchronous Day-1 response to an Allocation Instructions update request.
      type: object
      required:
        - status
        - requestId
      properties:
        requestId:
          description: |
           Server-assigned identifier for this update submission. Carried forward
            into the Day-2 confirmation event so consumers can correlate
            Day-1 and Day-2.
          type: string
        status:
          description: Synchronous-tier outcome.
          type: string
          const: ACCEPTED
        message:
          description: Optional informational message related to request submission.
          type: string
          maxLength: 500
        effectiveDate:
          type: string
          format: date
          description: When the transaction was originally scheduled or expected to happen; may be a non-business day.

    Day2ArrangementConfirmationEvent:
      x-event-mesh:
        broker: Advanced Event Mesh
        topicPattern: "{root}/ift/v1/{eventType}/{status}/{transactionType}/{firm}"
        deliveryModel: topic-subscription
        note: >
          Delivered over a message broker via topic subscription, not an HTTP
          callback.
      type: object
      description: >
        Canonical Day-2 arrangement confirmation event published to the
        enterprise event mesh after the arrangement request
        completes processing
      required:
        - eventType
        - eventId
        - eventTimestamp
        - associatedFirmId
        - requestId
        - policyNumber
        - transactionType
        - status
        - transExeDate
        - transExeTime
        - nsccParticipantId
        - npn
        - correlationId
      properties:
        # Event-level metadata
        eventType:
          type: string
          description: >
            Identifies the type of Day-2 confirmation event published to
            the event mesh. 
          enum:
            - DAY2_CONFIRM
        eventId:
          type: string
          format: uuid
          maxLength: 36
          description: >
            Globally unique identifier for this event. Used by consuming
            systems for idempotent processing and duplicate detection.
        eventTimestamp:
          type: string
          format: date-time
          description: >
            Date and time when the event was published to the event mesh.
        associatedFirmId:
          type: string
          maxLength: 65
          description: >
            Firm identifier associated with the transaction. 

        # Day-2 business outcome data
        requestId:
          type: string
          description: >
            Identifier assigned when the update request was submitted.
            Used to correlate the Day-2 confirmation with the original
            Day-1 request.
        correlationId:
          type: string
          maxLength: 100
          description: >
            Correlation identifier supplied with the original
            request and propagated to the Day-2 confirmation for
            end-to-end traceability.
        policyNumber:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            Policy number associated with the arrangement request.
        transactionType:
          type: string
          enum:
            - SUBMIT_ALLOCATION_INSTRUCTIONS
            - UPDATE_ALLOCATION_INSTRUCTIONS
            - CANCEL_ALLOCATION_INSTRUCTIONS
          description: >
            High-level classification of the transaction that completed
            processing.SUBMIT_* indicates creation of a new Allocation Instruction , UPDATE_* indicates modification of an existing Allocation Instruction,CANCEL_* indicates cancellation of an existing Allocation Instruction.
        status:
          type: string
          description: >
            Final processing outcome of the arrangement request.
          enum:
            - SUCCESS
            - SUCCESS_WITH_INFO
            - FAILURE
        message:
          type: string
          description: >
            Human-readable explanation of the outcome. Populated when the transaction fails or additional explanation is required.
        effectiveDate:
          type: string
          format: date
          description: >
            Effective date of the arrangement on the policy, when applicable.
        npn:
          type: string
          maxLength: 100
          description: >
            National Producer Number associated with the transaction,
            when available.
        nsccParticipantId:
          type: string
          maxLength: 100
          description: >
            NSCC participant identifier associated with the updating firm, when available.
        transExeDate:
          type: string
          format: date
          description: >
            Date on which the Day‑2 confirmation was produced by the
            transaction processing system.
        transExeTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: >
            Time on which the Day-2 confirmation was produced by the
            transaction processing system.

    Error:
      type: object
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >
            A structured error code that uniquely identifies the type of error. This can follow a hierarchical format:
            - `<domain>`: The logical domain (e.g., "gateway")
            - `<category>`: The error category (e.g., "client" or "server")
            - `<subcategory>`: A specific error identifier (e.g., "badrequest", "timeout")
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
        message:
          type: string
          description: Message with specific error details.
        validationErrors:
          type: array
          description: Logical rule violations or decision failures related to business logic or rules
          items:
            type: object
            properties:
              code:
                type: string
                description: Code to classify the error & Identifies the type of business rule or decision failure.
              message:
                type: string
                description: Why the error occurred / Specific business rule violation
      required:
        - code
        - message
  
    GetArrangementRequestStatus:
        type: object
        description: >
          Current processing status of a previously submitted Allocation Instructions update request.
        properties:
          requestId:
            type: string
            description: Server assigned identifier for this update request.
          status:
            type: string
            description: Current status of the arrangement request.
            enum: [IN_PROGRESS, SUCCESS, REJECTED]
          effectiveDate:
            type: string
            format: date
            description: When the transaction was originally scheduled or expected to happen; may be a non-business day.
          message:
            type: string
            description: >
              Optional informational or error message explaining the
              processing result.
        required: [requestId, status]